name: Comment Review URL

on:
    workflow_run:
        workflows: ["ci"]
        types:
            - completed

jobs:
    comment:
        runs-on: ubuntu-latest
        permissions:
            pull-requests: write
        if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
        steps:
            - name: Download PR info artifact
              uses: actions/download-artifact@v4
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  run-id: ${{ github.event.workflow_run.id }}
                  name: pr-info
                  path: ./pr-info

            - name: Read PR info
              id: pr-info
              run: |
                  echo "pr-number=$(cat ./pr-info/pr-number)" >> "$GITHUB_OUTPUT"
                  echo "deployment-url=$(cat ./pr-info/deployment-url)" >> "$GITHUB_OUTPUT"

            - name: Comment preview URL on PR
              uses: actions/github-script@v7
              env:
                  PR_NUMBER: ${{ steps.pr-info.outputs.pr-number }}
                  DEPLOY_URL: ${{ steps.pr-info.outputs.deployment-url }}
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      github.rest.issues.createComment({
                           issue_number: Number(process.env.PR_NUMBER),
                           owner: context.repo.owner,
                           repo: context.repo.repo,
                           body: `✅ Preview deployed: ${process.env.DEPLOY_URL}`
                       })
