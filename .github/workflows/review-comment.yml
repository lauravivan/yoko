name: Comment Review URL

on:
    workflow_run:
        workflows: ["ci"]
        types:
            - completed

permissions:
    pull-requests: write

jobs:
    comment:
        runs-on: ubuntu-latest
        if: github.event.workflow_run.conclusion == 'success'
        steps:
            - name: Download PR info artifact
              uses: actions/download-artifact@v4
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  run-id: ${{ github.event.workflow_run.id }}
                  name: pr-info
                  path: ./pr-info

            - name: Read PR info
              id: pr-info
              run: |
                  echo "pr-number=$(cat ./pr-info/pr-number)" >> "$GITHUB_OUTPUT"
                  echo "deployment-url=$(cat ./pr-info/deployment-url)" >> "$GITHUB_OUTPUT"

            - name: Comment preview URL on PR
              uses: actions/github-script@v7
              with:
                  script: |
                      github.rest.issues.createComment({
                        issue_number: ${{ steps.pr-info.outputs.pr-number }},
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        body: `✅ Preview deployed: ${{ steps.pr-info.outputs.deployment-url }}`
                      })
