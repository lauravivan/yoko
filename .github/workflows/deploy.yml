name: Deploy to Firebase Hosting

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    name: Lint and Type Check
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Get changed files
        id: changed-files
        run: |
          FILES=$(git diff --name-only --diff-filter=ACMRT origin/${{ github.base_ref }}...HEAD | grep -E '\.(js|jsx|ts|tsx|json|md|mdx)$' || true)
          SOURCE_FILES=$(git diff --name-only --diff-filter=ACMRT origin/${{ github.base_ref }}...HEAD | grep -E '\.(js|jsx|ts|tsx)$' || true)
          TEST_FILES=$(echo "$SOURCE_FILES" | grep -E '^src/' || true)

          echo "files=$(echo $FILES | xargs)" >> $GITHUB_OUTPUT
          echo "source_files=$(echo $SOURCE_FILES | xargs)" >> $GITHUB_OUTPUT
          echo "should_test=$([ -n "$TEST_FILES" ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

      - name: Run Format
        if: steps.changed-files.outputs.files != ''
        id: format
        run: npm run format:check -- ${{ steps.changed-files.outputs.files }}
        continue-on-error: true

      - name: Run TypeScript type check
        if: steps.changed-files.outputs.source_files != ''
        id: typecheck
        run: npm run type-check -- ${{ steps.changed-files.outputs.source_files }}

      - name: Run ESLint
        if: steps.changed-files.outputs.source_files != ''
        id: lint
        run: npm run lint -- ${{ steps.changed-files.outputs.source_files }}

      - name: Run tests
        if: steps.changed-files.outputs.should_test == 'true'
        id: tests
        working-directory: src/
        run: npm run test:coverage

      - name: Check for failures
        if: always()
        run: |
          if [[ "${{ steps.format.outcome }}" == "failure" || "${{ steps.lint.outcome }}" == "failure" || "${{ steps.tests.outcome }}" == "failure" ]]; then
            echo "## ❌ CI falhou" >> $GITHUB_STEP_SUMMARY
            echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| Format | ${{ steps.format.outcome == 'failure' && '❌' || '✅' }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Typecheck | ${{ steps.typecheck.outcome == 'failure' && '❌' || '✅' }} |" >> $GITHUB_STEP_SUMMARY
            echo "| ESLint | ${{ steps.lint.outcome == 'failure' && '❌' || '✅' }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Tests | ${{ steps.tests.outcome == 'failure' && '❌' || '✅' }} |" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  build-and-deploy-production:
    runs-on: ubuntu-latest
    name: Build and Deploy Production
    needs: lint-and-type-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.FIREBASE_MEASUREMENT_ID }}
          VITE_HOSTING_URL: ${{ vars.URL_PRODUCTION }}

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Deploy to Firebase Hosting (Production)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live

  build-and-deploy-develop:
    runs-on: ubuntu-latest
    name: Build and Deploy Develop
    needs: lint-and-type-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.FIREBASE_MEASUREMENT_ID }}
          VITE_HOSTING_URL: ${{ vars.URL_PREVIEW }}

      - name: Deploy to Firebase Hosting (Development Channel)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: develop
